<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="fechar()">Fechar</ion-button>
    </ion-buttons>
    <ion-title>Mapa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="form" [scrollY]="false">
  <div
    class="mapa-layout"
    *ngIf="visao && (visao === MapaVisao.CORPO_FRENTE || visao === MapaVisao.CORPO_VERSO || imagemSrc)"
  >
    <aside class="mapa-toolbox" aria-label="Ferramentas do mapa">
      <ion-button
        fill="clear"
        [color]="ferramentaAtiva === MapaFerramenta.PISTOLA ? 'primary' : 'medium'"
        (click)="selecionarFerramenta(MapaFerramenta.PISTOLA)"
        title="Pistola (PAF)"
        aria-label="Pistola (PAF)"
      >
        <img slot="icon-only" class="mapa-toolbox-img" src="assets/toolbox/pistola.svg" alt="" />
      </ion-button>
      <ion-button
        fill="clear"
        [color]="ferramentaAtiva === MapaFerramenta.FACA ? 'primary' : 'medium'"
        (click)="selecionarFerramenta(MapaFerramenta.FACA)"
        title="Faca (instrumento cortante)"
        aria-label="Faca (instrumento cortante)"
      >
        <img slot="icon-only" class="mapa-toolbox-img" src="assets/toolbox/faca.svg" alt="" />
      </ion-button>
      <ion-button
        fill="clear"
        [color]="ferramentaAtiva === MapaFerramenta.TACO ? 'primary' : 'medium'"
        (click)="selecionarFerramenta(MapaFerramenta.TACO)"
        title="Contundente"
        aria-label="Contundente"
      >
        <img slot="icon-only" class="mapa-toolbox-img" src="assets/toolbox/punho.svg" alt="" />
      </ion-button>
      <ion-button
        fill="clear"
        [color]="ferramentaAtiva === MapaFerramenta.HEMATOMA ? 'primary' : 'medium'"
        (click)="selecionarFerramenta(MapaFerramenta.HEMATOMA)"
        title="Hematoma"
        aria-label="Hematoma"
      >
        <img slot="icon-only" class="mapa-toolbox-img" src="assets/toolbox/hematoma.svg" alt="" />
      </ion-button>
      <ion-button
        fill="clear"
        [color]="ferramentaAtiva === MapaFerramenta.BORRACHA ? 'primary' : 'medium'"
        (click)="selecionarFerramenta(MapaFerramenta.BORRACHA)"
        title="Borracha (apagar)"
        aria-label="Borracha (apagar)"
      >
        <img slot="icon-only" class="mapa-toolbox-img" src="assets/toolbox/limpar.svg" alt="" />
      </ion-button>
    </aside>
    <div class="mapa-container">
    <object
      *ngIf="visao === MapaVisao.CORPO_FRENTE"
      class="mapa-croqui"
      type="image/svg+xml"
      data="assets/mapas/corpo-frente/corpo-frente.svg"
      aria-label="Mapa corpo (frente)"
      title="Corpo (frente)"
      (load)="onCroquiSvgCarregado($event)"
    ></object>
    <object
      *ngIf="visao === MapaVisao.CORPO_VERSO"
      class="mapa-croqui"
      type="image/svg+xml"
      data="assets/mapas/corpo-verso/corpo-verso.svg"
      aria-label="Mapa corpo (verso)"
      title="Corpo (verso)"
      (load)="onCroquiSvgCarregado($event)"
    ></object>
    <img
      *ngIf="visao !== MapaVisao.CORPO_FRENTE && visao !== MapaVisao.CORPO_VERSO"
      class="mapa-imagem"
      [src]="imagemSrc"
      alt="Mapa"
      [attr.title]="visao"
    />
    </div>
  </div>
  <p class="mapa-erro" *ngIf="!visao">Parâmetro de visão inválido ou ausente.</p>
</ion-content>
