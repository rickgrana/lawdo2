<ion-header [translucent]="true">
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title size="large">Perfil do Usuário</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="logout()">Sair</ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" *ngIf="auth.user$ | async as user; else loading">

  <ion-card *ngIf="showWelcomeCadastro" color="primary">
    <ion-card-header>
      <ion-card-title>Bem-vindo</ion-card-title>
      <ion-card-subtitle>O primeiro passo é completar o cadastro da sua conta.</ion-card-subtitle>
    </ion-card-header>
  </ion-card>

  <form *ngIf="form" class="form" [formGroup]="form" (ngSubmit)="updateUser(form.value)">
    <ion-row>
      <ion-col size="12">
        <ion-item>
          <ion-input label="Nome Completo" labelPosition="floating" formControlName="nomeCompleto"></ion-input>
        </ion-item>
      </ion-col>

      <ion-col size-md="4" size-xs="12">
        <ion-item>
          <ion-input label="Matrícula" labelPosition="floating" formControlName="matricula"></ion-input>
        </ion-item>
      </ion-col>

      <ion-col size-md="3" size-xs="12">
        <ion-item>
          <ion-select label="Sexo" labelPosition="floating" formControlName="sexo">
            <ion-select-option value="M">Masculino</ion-select-option>
            <ion-select-option value="F">Feminino</ion-select-option>
          </ion-select>
        </ion-item>
      </ion-col>

      <ion-col size-md="12" size-xs="12">
        <ion-item>
          <ion-select label="Corporação" labelPosition="floating" formControlName="corporacao"
                      (ionChange)="selecionarCorporacao($event)">
            <ion-select-option
              *ngFor="let item of corporacoes"
              [value]="item.id">
              [{{item.uf}}] {{item.sigla}}
            </ion-select-option>
          </ion-select>
        </ion-item>
      </ion-col>

      <ion-col size-md="12" size-xs="12" *ngIf="unidades.length > 0">
        <ion-item>
          <ion-select label="Unidade Pericial" labelPosition="floating" formControlName="unidade">
            <ion-select-option
              *ngFor="let item of unidades"
              [value]="item.id">
              {{item.sigla}}
            </ion-select-option>
          </ion-select>
        </ion-item>
      </ion-col>

      <ion-col size-md="12" size-xs="12">
        <ion-item>
          <ion-input label="Superior" labelPosition="floating" formControlName="superior"></ion-input>
        </ion-item>
      </ion-col>

    </ion-row>

  </form>

</ion-content>

<ng-template #loading>
  <ion-content class="ion-padding">
    Aguarde. Carregando...
  </ion-content>
</ng-template>


<ion-footer *ngIf="form">
  <ion-toolbar>

    <ion-button
      type="submit"
      expand="block"
      color="success"
      [disabled]="form.invalid"
      (click)="updateUser(form.value)">

      Salvar

    </ion-button>

  </ion-toolbar>
</ion-footer>
