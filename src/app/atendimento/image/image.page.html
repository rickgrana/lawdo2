<ion-header>
  <ion-toolbar>
      <ion-buttons slot="start">
          <ion-back-button></ion-back-button>
      </ion-buttons>
      
    <ion-title>{{titulo}}</ion-title>

    <ion-buttons slot="end">

      <ion-button (click)="presentImageActions()" *ngIf="imageLoaded && !cropperEnabled && !drawEnabled" title="Opções da imagem">
          <ion-icon name="ellipsis-vertical-outline"></ion-icon>
      </ion-button>

      <ion-button (click)="doCrop()" *ngIf="cropperEnabled">
          <ion-label>OK</ion-label>
      </ion-button>

      <ion-button (click)="destroyCrop()" *ngIf="cropperEnabled">
          <ion-label >Desfazer</ion-label>
      </ion-button>

      <ion-button (click)="cancelDrawing()" *ngIf="drawEnabled">
          <ion-label>Cancelar desenho</ion-label>
      </ion-button>

      <ion-button (click)="applyDrawing()" [disabled]="!hasDrawn" *ngIf="drawEnabled">
          <ion-label>Aplicar desenho</ion-label>
      </ion-button>

      <ion-button (click)="remover()" *ngIf="this.imagem !== null">
          <ion-label><ion-icon name="trash"></ion-icon></ion-label>
      </ion-button>

    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content>
    <ion-item  *ngIf="!cropperEnabled && !drawEnabled">
      <div class="img-container">
          <img #image [src]="imageSource"  id="imageSource" crossorigin="anonymous"
            alt="Adicionar Imagem" width="100%" height="100%"
            style="object-fit: contain">
          <div class="detection-loading-overlay" *ngIf="detectionBusy" aria-live="polite">
            <ion-spinner name="crescent"></ion-spinner>
            <span>{{ detectionMessage }}</span>
          </div>
      </div>
    </ion-item>

    <ion-grid  *ngIf="!cropperEnabled && !drawEnabled">
        <ion-row>
          <ion-col size="12">
            <ion-item>
                <ion-input label="Legenda" labelPosition="floating" [(ngModel)]="legenda"></ion-input>
            </ion-item>
          </ion-col>
        </ion-row>
    </ion-grid>

    <div class="draw-container" *ngIf="drawEnabled">
      <div class="draw-stage">
        <img
          #drawImage
          [src]="imageSource"
          alt="Imagem para desenhar"
          class="draw-image"
          (load)="onDrawImageLoad()"
        >
        <canvas
          #drawCanvas
          class="draw-canvas"
          (pointerdown)="beginDraw($event)"
          (pointermove)="draw($event)"
          (pointerup)="endDraw()"
          (pointerleave)="endDraw()"
          (pointercancel)="endDraw()"
          (touchstart)="startTouchDraw($event)"
          (touchmove)="moveTouchDraw($event)"
          (touchend)="endTouchDraw($event)"
        ></canvas>
      </div>
      <ion-grid class="draw-actions ion-no-padding">
        <ion-row class="ion-align-items-center draw-color-row">
          <ion-col size="4">
            <ion-label>Cor do traço</ion-label>
          </ion-col>
          <ion-col size="8" class="draw-color-picker-wrap">
            <input
              type="color"
              class="draw-color-picker"
              [value]="drawColor"
              (input)="onDrawColorChange($event)"
            >
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="6">
            <ion-button expand="block" color="medium" (click)="cancelDrawing()">Cancelar desenho</ion-button>
          </ion-col>
          <ion-col size="6">
            <ion-button expand="block" color="primary" [disabled]="!hasDrawn" (click)="applyDrawing()">Aplicar desenho</ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>

    <div class="cropper-container" *ngIf="cropperEnabled">
      <cropper-canvas background style="height: 100%">
        <cropper-image [src]="imageSource" alt="Picture" rotatable scalable skewable translatable></cropper-image>
        <cropper-shade hidden></cropper-shade>
        <cropper-handle action="select" plain></cropper-handle>
        <cropper-selection id="cropperSelection" initial-coverage="0.5" movable resizable>
          <cropper-grid role="grid" covered></cropper-grid>
          <cropper-crosshair centered></cropper-crosshair>
          <cropper-handle action="move" theme-color="rgba(255, 255, 255, 0.35)"></cropper-handle>
          <cropper-handle action="n-resize"></cropper-handle>
          <cropper-handle action="e-resize"></cropper-handle>
          <cropper-handle action="s-resize"></cropper-handle>
          <cropper-handle action="w-resize"></cropper-handle>
          <cropper-handle action="ne-resize"></cropper-handle>
          <cropper-handle action="nw-resize"></cropper-handle>
          <cropper-handle action="se-resize"></cropper-handle>
          <cropper-handle action="sw-resize"></cropper-handle>
        </cropper-selection>
      </cropper-canvas>
    </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
      <ion-button expand="block" color="success" (click)="salvar()" [disabled]="drawEnabled">Salvar</ion-button>
  </ion-toolbar>
</ion-footer>
