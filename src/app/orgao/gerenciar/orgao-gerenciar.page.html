<ion-header>
  <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

    <ion-title>Corporações</ion-title>
  </ion-toolbar>
</ion-header>
  
<ion-content>
  <ion-list>
    <ion-item class="ion-align-items-center" *ngIf="!loading && ((items == null) || (items.length == 0))">
        <ion-text   class="ion-text-center">
          Nenhum órgão cadastrado na UF do Usuário.
        </ion-text>
    </ion-item>

    <ion-card *ngFor="let item of items">
      <ion-grid>
        <ion-row>
          
          <ion-col size="12">
              <ion-label>{{item.sigla.toUpperCase()}}</ion-label><br/>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card>
  </ion-list>
</ion-content>
