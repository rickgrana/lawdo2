<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button></ion-back-button>
        </ion-buttons>
        <ion-title>Vítimas</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content>

    <ion-row *ngIf="model!.fields!.vitimas.length == 0" 
        class="ion-align-items-center" style="height: 100%">
        <ion-col>
            <p class="ion-text-center ion-margin">Nenhuma Vítima adicionada</p>
        </ion-col>
    </ion-row>

    <ion-list>
        <ion-item button *ngFor="let vitima of model!.fields!.vitimas, let i = index" (click)="abrirVitima(i)">
          <ion-grid>
            <ion-row>
              <ion-col size="11">
                
                <ion-label>
                    <fa-icon [icon]="getSexoIcon(vitima.sexo)"></fa-icon>
                    &nbsp;<b> 
                      <span *ngIf="((vitima.identificada === true) || (vitima.identificada !== 'Não reconhecida')); else vitimaNI">
                        {{vitima.nome.toUpperCase()}}
                      </span>
                      <ng-template #vitimaNI><i>(Não Reconhecida)</i></ng-template>

                    </b>
                </ion-label>

                
              </ion-col>

              <ion-col size="1">
                <ion-icon name="trash" slot="" 
                    (click)="removerVitima($event, i)" 
                    title="Clique para remover esta vítima"></ion-icon>
              </ion-col>

            </ion-row>
          </ion-grid>
        
        </ion-item>
      
    </ion-list>

</ion-content>


<ion-footer>

    <ion-button (click)="adicionarVitima()" color="primary" title="Nova vítima"  expand="block">
        Adicionar
    </ion-button>

  </ion-footer>
