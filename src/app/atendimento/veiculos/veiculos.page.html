<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button></ion-back-button>
        </ion-buttons>
        <ion-title>Veículos</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content>

    <ion-row *ngIf="model!.fields.veiculos.length == 0" 
        class="ion-align-items-center" style="height: 100%">
        <ion-col>
            <p class="ion-text-center ion-margin">Nenhum Veículo adicionado</p>
        </ion-col>
    </ion-row>

    <ion-list>
        <ion-item button *ngFor="let veiculo of model!.fields.veiculos, let i = index" (click)="abrir(i)">
            <ion-grid>
                <ion-row>
                    <ion-col>
                        <h2>VEÍCULO {{getNumero(i+1)}}</h2>
                    </ion-col>
                </ion-row>
                
                <ion-row>
                    <ion-col size="6">
                        <ion-label>
                            {{veiculo.tipo.toUpperCase()}}
                        </ion-label>
                    </ion-col>

                    <ion-col size="6">
                        <ion-label>
                            {{veiculo.placa.toUpperCase()}}
                        </ion-label>
                    </ion-col>
                </ion-row>
            </ion-grid>
        </ion-item>
    </ion-list>
</ion-content>

<ion-footer>
    <ion-button (click)="adicionar()" color="primary" expand="block">
        Adicionar
    </ion-button>
</ion-footer>
